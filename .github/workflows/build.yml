name: Validate, Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - run: npm test
      - run: python server/tests/run.py
      - run: npm run check:release
      - if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) process.exit(1)"
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: npm run build:win
          - os: macos-latest
            name: macos
            command: npm run build:mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: ${{ matrix.command }}
      - run: node scripts/check-release.js --packages
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-build'
          merge-multiple: true
          path: release-files
      - name: Verify complete artifact set and write checksums
        run: |
          python3 scripts/release-manifest.py release-files
      - uses: softprops/action-gh-release@v2
        with:
          name: Takaneko Fanclub Downloader ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-files/*.dmg
            release-files/*.zip
            release-files/*.exe
            release-files/SHA256SUMS.txt
