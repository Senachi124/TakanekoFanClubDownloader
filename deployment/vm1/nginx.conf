user www-data;
worker_processes 1;
pid /run/takaneko-nginx.pid;
error_log /var/log/takaneko/error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    limit_req_zone $binary_remote_addr zone=takaneko_login:1m rate=6r/m;
    server {
        listen 2083 ssl;
        listen [::]:2083 ssl;
        server_name vm1.learnfromidol.com;
        ssl_certificate /etc/letsencrypt/live/vm1.learnfromidol.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vm1.learnfromidol.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 600k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
        location = /api/login {
            limit_req zone=takaneko_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:43130;
        }
        location / { proxy_pass http://127.0.0.1:43130; }
    }
}
